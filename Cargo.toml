[package]
name = "ppscount"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Count inbound packets/sec from interface or pcap file with exclusion filter."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.9"
chrono = "0.4"
libc = "0.2"
ctrlc = "3.4"
anyhow = "1.0"
