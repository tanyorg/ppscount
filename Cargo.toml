[package]
name = "ppscount"
version = "0.1.0"
edition = "2021"
authors = ["Fuminori -Tany- Tanizaki"]
description = "Count inbound packets/sec from interface or pcap file with exclusion filter."

[features]
default = []
af-xdp = ["dep:xsk-rs"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.9"
chrono = "0.4"
libc = "0.2"
ctrlc = "3.4"
anyhow = "1.0"
pcap = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
xsk-rs = { version = "0.7", optional = true } # AF_XDP socket handling library